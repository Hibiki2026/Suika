
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suika 🍉</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{
 background:linear-gradient(135deg,#dce9df,#cbdcd2,#e9e7d9);
 color:#344b40;text-align:center;
 font-family:system-ui,sans-serif;padding:12px 8px 25px;
}
h1{margin:4px 0 12px;color:#426b54;font-size:32px}
.panel,.savebox,.evolution,.controls{
 max-width:460px;margin:12px auto;background:#ffffffbd;
 border:1px solid #ffffff;border-radius:20px;padding:12px;
 box-shadow:0 7px 20px #617c6830;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{background:#e7eee7;border-radius:13px;padding:8px 3px}
.stat small{display:block;font-size:11px;color:#607568}
.stat strong{font-size:21px;color:#365c45}
#game{
 position:relative;width:min(100%,420px);
 height:min(500px,72vh);
 min-height:350px;
 margin:12px auto 5px;
 overflow:hidden;border:4px solid white;
 border-radius:17px;background:#e8efe5;
 box-shadow:inset 0 0 18px #ffffffaa,0 5px 15px #637a6850;
 touch-action:none;
}
canvas{width:100%;height:100%;display:block;touch-action:none}
#message{
 display:none;position:absolute;inset:0;z-index:5;
 align-items:center;justify-content:center;flex-direction:column;
 background:#344b40dd;color:white;
}
#message h2{font-size:32px}
button{
 border:0;border-radius:30px;padding:11px 18px;margin:5px;
 font-weight:900;font-size:14px;color:#355b45;
 background:#f7fff7;box-shadow:0 4px 0 #b8cdbb;
 cursor:pointer;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8cdbb}
.hint{font-size:12px;color:#65786a;margin:8px}
.fruits{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
.fruit-step{
 width:36px;height:43px;border-radius:10px;
 background:#e9eee6;display:flex;align-items:center;
 justify-content:center;flex-direction:column;font-size:23px;
}
.fruit-step small{font-size:9px}
textarea{
 width:100%;height:90px;border:2px solid #c6d8c9;
 border-radius:12px;padding:10px;background:#fafffa;
 color:#344b40;font-size:12px;
}
.key{
 display:inline-block;background:#e7eee7;
 border:1px solid #b9cdbd;border-radius:7px;
 padding:4px 9px;margin:3px;font-weight:bold;
}
#status{font-size:13px;min-height:20px;font-weight:bold}
</style>
</head>
<body>

<h1>🍉 Suika 🍉</h1>

<div class="panel">
 <div class="stats">
  <div class="stat"><small>⭐ スコア</small><strong id="score">0</strong></div>
  <div class="stat"><small>🏆 ベスト</small><strong id="best">0</strong></div>
  <div class="stat"><small>🎮 プレイ回数</small><strong id="plays">0</strong></div>
 </div>

 <div class="stat" style="margin-top:9px">
  <small>🍒 次のフルーツ</small>
  <strong id="next">🍒</strong>
 </div>

 <div id="game">
  <canvas id="canvas" width="420" height="500"></canvas>
  <div id="message">
   <h2>ゲームオーバー！</h2>
   <p id="finalScore"></p>
   <button onclick="restart()">もう一度遊ぶ 🔄</button>
  </div>
 </div>

 <div class="hint">← → または A・D で移動 / SPACE で落とす</div>
 <button onclick="restart()">🔄 リスタート</button>
</div>

<div class="controls">
 <h3>⌨️ キーボード操作</h3>
 <span class="key">←</span><span class="key">→</span>
 <span class="key">A</span><span class="key">D</span> 移動
 <br>
 <span class="key">SPACE</span> 落とす
 <div class="hint">ゲーム操作中はスペースキーでページがスクロールしません。</div>
</div>

<div class="savebox">
 <h3>💾 セーブ・引き継ぎ</h3>
 <button onclick="createSave()">セーブコード発行</button>
 <button onclick="copySave()">📋 コピー</button>
 <textarea id="saveCode" placeholder="セーブコード"></textarea>
 <button onclick="loadSave()">📥 読み込む</button>
 <div id="status"></div>
</div>

<div class="evolution">
 <h3>🌈 フルーツ進化の輪</h3>
 <div class="fruits" id="evolution"></div>
</div>

<script>
"use strict";

const {Engine,Bodies,Body,Composite}=Matter;

const W=420,H=500;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const fruits=[
 {emoji:"🍒",name:"さくらんぼ",r:16,points:1},
 {emoji:"🍓",name:"いちご",r:23,points:3},
 {emoji:"🍇",name:"ぶどう",r:29,points:6},
 {emoji:"🍊",name:"みかん",r:35,points:10},
 {emoji:"🍋",name:"レモン",r:41,points:15},
 {emoji:"🍑",name:"もも",r:48,points:21},
 {emoji:"🍍",name:"パイン",r:55,points:28},
 {emoji:"🥥",name:"ココナッツ",r:63,points:36},
 {emoji:"🍈",name:"メロン",r:72,points:45},
 {emoji:"🍉",name:"スイカ",r:82,points:60}
];

const engine=Engine.create({
 enableSleeping:false,
 gravity:{x:0,y:1.15,scale:0.001}
});

let score=0;
let best=Number(localStorage.getItem("suikaBest")||0);
let plays=Number(localStorage.getItem("suikaPlays")||0);
let nextLevel=0;
let currentX=W/2;
let canDrop=true;
let gameOver=false;
let bodies=[];
let effects=[];
let overflowTimer=0;
let lastTime=0;
let lastDrop=0;
const dropCooldown=450;
let keys={left:false,right:false};

function stats(){
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("plays").textContent=plays;
}

function makeEvolution(){
 const el=document.getElementById("evolution");
 el.innerHTML="";
 fruits.forEach((f,i)=>{
  const d=document.createElement("div");
  d.className="fruit-step";
  d.innerHTML=f.emoji+"<small>"+(i+1)+"</small>";
  el.appendChild(d);
 });
}

function addWalls(){
 Composite.add(engine.world,[
  Bodies.rectangle(-12,H/2,24,H,{isStatic:true}),
  Bodies.rectangle(W+12,H/2,24,H,{isStatic:true}),
  Bodies.rectangle(W/2,H+12,W,24,{isStatic:true})
 ]);
}

function createFruit(x,y,level){
 const f=fruits[level];
 const b=Bodies.circle(x,y,f.r,{
  restitution:.12,friction:.15,density:.0015,
  frictionAir:.002,label:"fruit"
 });
 b.level=level;
 b.merging=false;
 Composite.add(engine.world,b);
 bodies.push(b);
 return b;
}

function updateNext(){
 document.getElementById("next").textContent=fruits[nextLevel].emoji;
}

function startGame(count=true){
 Composite.clear(engine.world,false);
 Engine.clear(engine);
 bodies=[];
 effects=[];
 score=0;
 overflowTimer=0;
 gameOver=false;
 canDrop=true;
 currentX=W/2;
 keys={left:false,right:false};

 if(count){
  plays++;
  localStorage.setItem("suikaPlays",plays);
 }

 stats();
 document.getElementById("message").style.display="none";
 addWalls();
 nextLevel=Math.floor(Math.random()*5);
 updateNext();
}

function restart(){startGame(true)}

function updateScore(n){
 score+=n;
 if(score>best){
  best=score;
  localStorage.setItem("suikaBest",best);
 }
 stats();
}

function drop(){
 if(!canDrop||gameOver)return;
 const r=fruits[nextLevel].r;
 const x=Math.max(r+5,Math.min(W-r-5,currentX));
 createFruit(x,65,nextLevel);
 nextLevel=Math.floor(Math.random()*5);
 updateNext();
 canDrop=false;
 lastDrop=performance.now();
}

function merge(a,b){
 if(gameOver||a.merging||b.merging||a.level!==b.level)return;
 if(a.level>=fruits.length-1)return;

 a.merging=true;
 b.merging=true;

 const x=(a.position.x+b.position.x)/2;
 const y=(a.position.y+b.position.y)/2;
 const level=a.level+1;

 Composite.remove(engine.world,a);
 Composite.remove(engine.world,b);
 bodies=bodies.filter(v=>v!==a&&v!==b);

 const n=createFruit(x,y,level);
 Body.setVelocity(n,{x:0,y:-2});
 updateScore(fruits[level].points);
 addEffect(x,y,fruits[level].emoji);
}

function collisionCheck(){
 for(const p of engine.pairs.list){
  if(!p.isActive)continue;
  const a=p.bodyA,b=p.bodyB;
  if(a.label!=="fruit"||b.label!=="fruit")continue;
  if(a.level===b.level&&a.level<fruits.length-1){
   merge(a,b);
  }
 }
}

function addEffect(x,y,emoji){
 effects.push({x,y,emoji,life:1,size:32,vy:-3});
 for(let i=0;i<10;i++){
  effects.push({
   x,y,emoji:"✨",life:1,size:12+Math.random()*12,
   vx:(Math.random()-.5)*8,vy:-Math.random()*7
  });
 }
}

/* フルーツの絵文字を直接描く。色付きの丸は描かない */
function drawFruit(b){
 const f=fruits[b.level];
 const r=f.r;
 ctx.save();
 ctx.translate(b.position.x,b.position.y);
 ctx.rotate(b.angle);

 ctx.font=`${r*2.05}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.shadowColor="#415b4655";
 ctx.shadowBlur=5;
 ctx.fillText(f.emoji,0,2);

 ctx.restore();
}

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#e5eee4");
 g.addColorStop(1,"#f1eee1");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.save();
 ctx.setLineDash([7,7]);
 ctx.strokeStyle="#9caf9d";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(0,90);
 ctx.lineTo(W,90);
 ctx.stroke();
 ctx.restore();

 ctx.fillStyle="#87998b";
 ctx.font="12px sans-serif";
 ctx.fillText("GAME OVER LINE",8,82);
}

function drawPreview(){
 if(gameOver||!canDrop)return;
 const f=fruits[nextLevel];
 ctx.save();
 ctx.globalAlpha=.65;
 ctx.font=`${f.r*2.05}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(f.emoji,currentX,65);
 ctx.restore();
}

function drawEffects(dt){
 effects=effects.filter(e=>e.life>0);
 for(const e of effects){
  e.x+=(e.vx||0);
  e.y+=e.vy;
  e.life-=dt/650;
  ctx.save();
  ctx.globalAlpha=Math.max(0,e.life);
  ctx.font=e.size+"px serif";
  ctx.textAlign="center";
  ctx.fillText(e.emoji,e.x,e.y);
  ctx.restore();
 }
}

function checkGameOver(dt){
 if(gameOver)return;
 let danger=false;
 for(const b of bodies){
  if(b.position.y-fruits[b.level].r<95&&
     b.position.y>80&&Math.abs(b.velocity.y)<.5){
   danger=true;break;
  }
 }
 if(danger)overflowTimer+=dt;
 else overflowTimer=0;

 if(overflowTimer>1800){
  gameOver=true;
  document.getElementById("finalScore").textContent="スコア："+score+" 点";
  document.getElementById("message").style.display="flex";
 }
}

/* キーボード：ページスクロールを先回りして止める */
function typing(){
 const el=document.activeElement;
 return el&&(
  el.tagName==="TEXTAREA"||
  el.tagName==="INPUT"||
  el.tagName==="SELECT"||
  el.isContentEditable
 );
}

function stopPageScroll(e){
 if(typing())return;
 const k=e.key.toLowerCase();
 if([" ","spacebar","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
  e.preventDefault();
 }
}

document.addEventListener("keydown",stopPageScroll,true);
window.addEventListener("keydown",e=>{
 if(typing())return;
 const k=e.key.toLowerCase();

 if(k==="arrowleft"||k==="a")keys.left=true;
 if(k==="arrowright"||k==="d")keys.right=true;

 if((k===" "||k==="spacebar"||k==="enter")&&!e.repeat){
  drop();
 }
},true);

window.addEventListener("keyup",e=>{
 if(typing())return;
 const k=e.key.toLowerCase();
 if([" ","spacebar","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
  e.preventDefault();
 }
 if(k==="arrowleft"||k==="a")keys.left=false;
 if(k==="arrowright"||k==="d")keys.right=false;
},true);

window.addEventListener("blur",()=>{
 keys.left=false;keys.right=false;
});

function updateKeyboard(dt){
 if(gameOver)return;
 const speed=.38*dt;
 if(keys.left)currentX-=speed;
 if(keys.right)currentX+=speed;
 const r=fruits[nextLevel].r;
 currentX=Math.max(r+5,Math.min(W-r-5,currentX));
}

canvas.addEventListener("pointermove",e=>{
 const rect=canvas.getBoundingClientRect();
 currentX=(e.clientX-rect.left)*W/rect.width;
 currentX=Math.max(20,Math.min(W-20,currentX));
});

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 const rect=canvas.getBoundingClientRect();
 currentX=(e.clientX-rect.left)*W/rect.width;
 drop();
});

function loop(time){
 const dt=Math.min(time-lastTime||16,32);
 lastTime=time;

 updateKeyboard(dt);

 if(!canDrop&&performance.now()-lastDrop>=dropCooldown){
  canDrop=true;
 }

 if(!gameOver){
  Engine.update(engine,dt);
  collisionCheck();
  checkGameOver(dt);
 }

 drawBackground();
 drawPreview();
 bodies.forEach(drawFruit);
 drawEffects(dt);

 requestAnimationFrame(loop);
}

/* セーブ */
function createSave(){
 const data={
  version:1,score,best,plays,nextLevel,currentX,
  gameOver,overflowTimer,
  fruits:bodies.map(b=>({
   level:b.level,x:b.position.x,y:b.position.y,
   vx:b.velocity.x,vy:b.velocity.y,
   angle:b.angle,av:b.angularVelocity
  }))
 };
 const code="SUIKA1-"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
 document.getElementById("saveCode").value=code;
 document.getElementById("status").textContent="✅ セーブコード発行完了！";
}

async function copySave(){
 if(!document.getElementById("saveCode").value.trim())createSave();
 const box=document.getElementById("saveCode");
 try{
  await navigator.clipboard.writeText(box.value);
  document.getElementById("status").textContent="📋 コピー完了！";
 }catch(e){
  box.select();
  document.execCommand("copy");
  document.getElementById("status").textContent="📋 コピーしました！";
 }
}

function loadSave(){
 try{
  const code=document.getElementById("saveCode").value.trim();
  if(!code.startsWith("SUIKA1-"))throw Error("コード形式が違います");

  const data=JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));
  if(data.version!==1||!Array.isArray(data.fruits))throw Error("データが不正です");
  if(data.fruits.length>500)throw Error("フルーツ数が多すぎます");
  if(!Number.isInteger(data.nextLevel)||data.nextLevel<0||data.nextLevel>=fruits.length)throw Error("次のフルーツが不正です");

  for(const f of data.fruits){
   if(!Number.isInteger(f.level)||f.level<0||f.level>=fruits.length||
    ![f.x,f.y,f.vx,f.vy,f.angle,f.av].every(Number.isFinite)){
    throw Error("盤面データが不正です");
   }
  }

  startGame(false);
  score=data.score;
  best=Math.max(data.best,best);
  plays=data.plays;
  nextLevel=data.nextLevel;
  currentX=Math.max(10,Math.min(W-10,Number(data.currentX)||W/2));
  gameOver=!!data.gameOver;
  overflowTimer=Number(data.overflowTimer)||0;

  for(const f of data.fruits){
   const b=createFruit(f.x,f.y,f.level);
   Body.setVelocity(b,{x:f.vx,y:f.vy});
   Body.setAngle(b,f.angle);
   Body.setAngularVelocity(b,f.av);
  }

  localStorage.setItem("suikaBest",best);
  localStorage.setItem("suikaPlays",plays);
  stats();updateNext();

  if(gameOver){
   document.getElementById("finalScore").textContent="スコア："+score+" 点";
   document.getElementById("message").style.display="flex";
  }
  document.getElementById("status").textContent="✅ 読み込み成功！";
 }catch(e){
  document.getElementById("status").textContent="❌ "+e.message;
 }
}

makeEvolution();
stats();
startGame(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
