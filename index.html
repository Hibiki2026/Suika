
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suika</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px 10px 30px;
  background:#e9eee7;color:#34443a;
  font-family:system-ui,sans-serif;text-align:center
}
h1{margin:5px 0 12px;font-size:32px}
.panel{
  max-width:460px;margin:0 auto 12px;padding:12px;
  background:#fff;border-radius:18px;
  box-shadow:0 4px 15px #52634b18
}
.stats{display:flex;justify-content:space-around;gap:7px}
.stat{flex:1;background:#f1f5ee;border-radius:12px;padding:8px}
.stat strong{display:block;font-size:22px}
.stat small{color:#718071}
button,select{
  border:0;border-radius:12px;padding:10px 14px;
  font-size:15px;background:#dce9d8;color:#34443a;
  cursor:pointer;margin:3px
}
.primary{background:#83ad83;color:white}
#game{
  position:relative;width:min(420px,96vw);
  height:500px;margin:auto;overflow:hidden;
  border:5px solid #9db49a;border-radius:18px;
  background:#f8f8ef;touch-action:none
}
canvas{display:block;width:100%;height:100%}
#message{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;background:#ffffffdf;
  font-size:25px;font-weight:bold
}
.controls{max-width:460px;margin:12px auto}
.hint{font-size:13px;color:#718071;line-height:1.7}
#saveInput{
  width:min(95%,400px);padding:10px;
  border:1px solid #ccd8c9;border-radius:10px
}
</style>
</head>
<body>

<h1>🍉 Suika</h1>

<div class="panel">
  <div class="stats">
    <div class="stat"><small>スコア</small><strong id="score">0</strong></div>
    <div class="stat"><small>ベスト</small><strong id="best">0</strong></div>
    <div class="stat"><small>プレイ回数</small><strong id="plays">0</strong></div>
  </div>
  <p>次のフルーツ：<span id="next">🍒</span></p>
  <label for="mode">モード：</label>
  <select id="mode">
    <option value="normal">通常モード</option>
    <option value="slippery">よく滑るモード 🧊</option>
  </select>
</div>

<div id="game">
  <canvas id="canvas" width="420" height="500"></canvas>
  <div id="message">
    <div>ゲームオーバー！</div>
    <p id="finalScore"></p>
    <button class="primary" onclick="restart()">もう一度遊ぶ</button>
  </div>
</div>

<div class="controls">
  <button onclick="move(-1)">◀ 左</button>
  <button class="primary" onclick="dropFruit()">⬇ 落とす</button>
  <button onclick="move(1)">右 ▶</button>
  <p class="hint">
    ← →：移動 ／ ↓：落とす<br>
    同じ果物を合体させて進化！<br>
    器から果物があふれるとゲームオーバー
  </p>
</div>

<div class="panel">
  <h3>セーブ・引き継ぎ</h3>
  <button class="primary" onclick="makeSave()">セーブコード発行</button>
  <button onclick="copySave()">コピー</button>
  <p><input id="saveInput" placeholder="セーブコードを入力"></p>
  <button onclick="loadSave()">読み込む</button>
</div>

<script>
const {
  Engine,Bodies,Body,Composite,Events
}=Matter;

const W=420,H=500;
const RIM=100;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const engine=Engine.create();
engine.gravity.y=1.05;

const FRUITS=[
  "🍒","🍓","🍇","🍊","🍋",
  "🍑","🍍","🥥","🍈","🍉"
];

// 基本サイズ
const BASE_RADII=[
  14,18,22,27,33,40,48,57,68,82
];

// 果物ごとの大きさ補正
const SIZE_SCALE=[
  1,1,1.5,1,1,1,1.3,1,1,2
];

function radius(level){
  return BASE_RADII[level]*SIZE_SCALE[level];
}

let fruits=[];
let score=0;
let best=Number(localStorage.getItem("suikaBest")||0);
let plays=Number(localStorage.getItem("suikaPlays")||0);
let nextLevel=0;
let currentLevel=0;
let currentX=W/2;
let gameOver=false;
let dropping=false;
let lastDrop=0;
let mergeLock=new Set();
let saveCode="";

const walls=[
  // 左右の壁。上部は開けておく
  Bodies.rectangle(0,(RIM+H)/2,30,H-RIM+40,{isStatic:true}),
  Bodies.rectangle(W,(RIM+H)/2,30,H-RIM+40,{isStatic:true}),
  // 底
  Bodies.rectangle(W/2,H+10,W,30,{isStatic:true})
];
Composite.add(engine.world,walls);

function updateStats(){
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=best;
  document.getElementById("plays").textContent=plays;
  document.getElementById("next").textContent=FRUITS[nextLevel];
}

function createFruit(x,y,level){
  const slippery=document.getElementById("mode").value==="slippery";
  const r=radius(level);

  const body=Bodies.circle(x,y,r,{
    restitution:slippery?0.12:0.02,
    friction:slippery?0.001:0.12,
    frictionStatic:slippery?0.001:0.5,
    frictionAir:slippery?0.0001:0.025,
    density:0.0015
  });

  body.level=level;
  body.isFruit=true;
  body.overflowTicks=0;

  fruits.push(body);
  Composite.add(engine.world,body);
  return body;
}

function applyMode(){
  const slippery=document.getElementById("mode").value==="slippery";

  for(const f of fruits){
    f.friction=slippery?0.001:0.12;
    f.frictionStatic=slippery?0.001:0.5;
    f.frictionAir=slippery?0.0001:0.025;
    f.restitution=slippery?0.12:0.02;
  }
}

function chooseNext(){
  nextLevel=Math.floor(Math.random()*5);
  updateStats();
}

function startCurrent(){
  if(gameOver)return;
  currentLevel=nextLevel;
  currentX=W/2;
  chooseNext();
}

function move(dir){
  if(gameOver||dropping)return;
  currentX=Math.max(25,Math.min(W-25,currentX+dir*22));
}

function dropFruit(){
  if(gameOver||dropping)return;

  const now=Date.now();
  if(now-lastDrop<180)return;
  lastDrop=now;

  dropping=true;
  createFruit(currentX,45,currentLevel);

  setTimeout(()=>{
    dropping=false;
    startCurrent();
  },350);
}

// 合体処理
Events.on(engine,"collisionStart",event=>{
  for(const pair of event.pairs){
    const a=pair.bodyA;
    const b=pair.bodyB;

    if(!a.isFruit||!b.isFruit)continue;
    if(a.level!==b.level)continue;
    if(a.level>=FRUITS.length-1)continue;
    if(mergeLock.has(a.id)||mergeLock.has(b.id))continue;

    mergeLock.add(a.id);
    mergeLock.add(b.id);

    const x=(a.position.x+b.position.x)/2;
    const y=(a.position.y+b.position.y)/2;
    const newLevel=a.level+1;

    setTimeout(()=>{
      if(!fruits.includes(a)||!fruits.includes(b))return;

      Composite.remove(engine.world,a);
      Composite.remove(engine.world,b);
      fruits=fruits.filter(f=>f!==a&&f!==b);

      mergeLock.delete(a.id);
      mergeLock.delete(b.id);

      createFruit(x,y,newLevel);

      score+=(newLevel+1)*10;
      if(score>best){
        best=score;
        localStorage.setItem("suikaBest",best);
      }
      updateStats();
    },80);
  }
});

// 果物の描画
function drawFruit(f){
  const r=radius(f.level);
  const x=f.position.x;
  const y=f.position.y;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(f.angle);

  if(f.level===9){
    // スイカは大きな丸い球体
    const grad=ctx.createRadialGradient(
      -r*.35,-r*.4,r*.08,0,0,r
    );
    grad.addColorStop(0,"#b9ed88");
    grad.addColorStop(.55,"#54a94e");
    grad.addColorStop(1,"#23713e");

    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    // スイカの縞
    ctx.strokeStyle="#23683c";
    ctx.lineWidth=Math.max(2,r*.09);
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.ellipse(i*r*.35,0,r*.2,r*.9,0,0,Math.PI*2);
      ctx.stroke();
    }

    // 種
    ctx.fillStyle="#263b2b";
    for(let i=0;i<7;i++){
      const a=i*Math.PI*2/7;
      ctx.beginPath();
      ctx.ellipse(
        Math.cos(a)*r*.4,
        Math.sin(a)*r*.4,
        r*.045,r*.09,a,0,Math.PI*2
      );
      ctx.fill();
    }
  }else if(f.level===2){
    // ぶどう：丸い粒を集めた形
    const points=[
      [-.25,-.48],[.25,-.48],[-.5,-.08],
      [0,-.08],[.5,-.08],[-.25,.34],[.25,.34],[0,.65]
    ];
    const pr=r*.34;
    const grad=ctx.createRadialGradient(-pr*.3,-pr*.4,1,0,0,pr*1.4);
    grad.addColorStop(0,"#d5a1fa");
    grad.addColorStop(1,"#7136a5");

    for(const p of points){
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.arc(p[0]*r,p[1]*r,pr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.strokeStyle="#4b813d";
    ctx.lineWidth=r*.07;
    ctx.beginPath();
    ctx.moveTo(0,-r*.8);
    ctx.lineTo(0,-r*.58);
    ctx.stroke();
  }else{
    // その他の果物：物理円に合わせて描画
    const emoji=FRUITS[f.level];
    const fontSize=r*1.55;

    ctx.save();
    ctx.beginPath();
    ctx.arc(0,0,r*.94,0,Math.PI*2);
    ctx.clip();

    ctx.font=`${fontSize}px serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(emoji,0,r*.04);

    ctx.restore();

    // パインは小さく見えないように補助表示
    if(f.level===6){
      ctx.strokeStyle="#558b3e";
      ctx.lineWidth=r*.07;
      ctx.beginPath();
      ctx.moveTo(0,-r*.85);
      ctx.lineTo(-r*.22,-r*1.05);
      ctx.moveTo(0,-r*.85);
      ctx.lineTo(r*.22,-r*1.05);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#f8f8ef";
  ctx.fillRect(0,0,W,H);

  // 器のふち
  ctx.strokeStyle="#9db49a";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(0,RIM);
  ctx.lineTo(0,H);
  ctx.lineTo(W,H);
  ctx.lineTo(W,RIM);
  ctx.stroke();

  // 器の内側の薄い色
  ctx.fillStyle="#edf2e8";
  ctx.fillRect(5,RIM+2,W-10,H-RIM-7);

  // 操作中の果物
  if(!gameOver&&!dropping){
    const r=radius(currentLevel);
    ctx.globalAlpha=.65;
    ctx.font=`${r*1.55}px serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(FRUITS[currentLevel],currentX,45);
    ctx.globalAlpha=1;
  }

  // 果物
  for(const f of fruits){
    drawFruit(f);
  }

  requestAnimationFrame(draw);
}

// 器からあふれたか確認
function checkOverflow(){
  if(gameOver)return;

  for(const f of fruits){
    const r=radius(f.level);

    // 落下中や合体直後は判定しない
    const aboveRim=f.position.y < RIM-r*.35;
    const slow=Math.abs(f.velocity.x)<0.35 &&
               Math.abs(f.velocity.y)<0.35;

    if(aboveRim&&slow){
      f.overflowTicks=(f.overflowTicks||0)+1;
      if(f.overflowTicks>100){
        endGame();
        return;
      }
    }else{
      f.overflowTicks=0;
    }
  }
}

function endGame(){
  gameOver=true;
  document.getElementById("finalScore").textContent="スコア："+score;
  document.getElementById("message").style.display="flex";
}

function restart(){
  for(const f of fruits){
    Composite.remove(engine.world,f);
  }

  fruits=[];
  mergeLock.clear();
  score=0;
  gameOver=false;
  dropping=false;
  currentX=W/2;

  document.getElementById("message").style.display="none";

  plays++;
  localStorage.setItem("suikaPlays",plays);

  updateStats();
  chooseNext();
  startCurrent();
}

function makeSave(){
  const data={
    score,best,plays,
    mode:document.getElementById("mode").value,
    currentLevel,nextLevel,currentX,
    fruits:fruits.map(f=>({
      x:f.position.x,
      y:f.position.y,
      vx:f.velocity.x,
      vy:f.velocity.y,
      angle:f.angle,
      level:f.level
    }))
  };

  saveCode="SUIKA3-"+btoa(
    unescape(encodeURIComponent(JSON.stringify(data)))
  );
  document.getElementById("saveInput").value=saveCode;
}

function copySave(){
  if(!saveCode)makeSave();
  const input=document.getElementById("saveInput");
  input.value=saveCode;
  input.select();
  document.execCommand("copy");
  alert("セーブコードをコピーしました！");
}

function loadSave(){
  try{
    const code=document.getElementById("saveInput").value.trim();
    if(!code.startsWith("SUIKA3-"))throw new Error();

    const data=JSON.parse(
      decodeURIComponent(escape(atob(code.slice(7))))
    );

    if(!Array.isArray(data.fruits))throw new Error();

    for(const f of fruits)Composite.remove(engine.world,f);
    fruits=[];
    mergeLock.clear();

    score=Number(data.score)||0;
    best=Math.max(Number(data.best)||0,best);
    plays=Number(data.plays)||plays;

    currentLevel=Math.max(0,Math.min(9,Number(data.currentLevel)||0));
    nextLevel=Math.max(0,Math.min(9,Number(data.nextLevel)||0));
    currentX=Math.max(25,Math.min(W-25,Number(data.currentX)||W/2));

    document.getElementById("mode").value=
      data.mode==="slippery"?"slippery":"normal";

    for(const f of data.fruits){
      const level=Math.max(0,Math.min(9,Number(f.level)||0));
      const body=createFruit(
        Math.max(20,Math.min(W-20,Number(f.x)||W/2)),
        Math.max(15,Math.min(H-15,Number(f.y)||H/2)),
        level
      );

      Body.setVelocity(body,{
        x:Number(f.vx)||0,
        y:Number(f.vy)||0
      });
      Body.setAngle(body,Number(f.angle)||0);
    }

    gameOver=false;
    dropping=false;
    document.getElementById("message").style.display="none";

    applyMode();
    updateStats();
    alert("読み込みました！");
  }catch(e){
    alert("セーブコードが正しくありません。");
  }
}

document.getElementById("mode").addEventListener("change",applyMode);

// キーボード操作
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowDown"].includes(e.key)){
    e.preventDefault();
    e.stopPropagation();
  }

  if(e.repeat)return;

  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.key==="ArrowDown")dropFruit();
},true);

// マウス・タッチ操作
canvas.addEventListener("pointermove",e=>{
  if(gameOver||dropping)return;

  const rect=canvas.getBoundingClientRect();
  currentX=Math.max(25,Math.min(W-25,
    (e.clientX-rect.left)*W/rect.width
  ));
});

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  dropFruit();
});

function loop(){
  Engine.update(engine,1000/60);
  checkOverflow();
  requestAnimationFrame(loop);
}

updateStats();
chooseNext();
startCurrent();
draw();
loop();
</script>
</body>
</html>
