
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suika 🍉</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 min-height:100%;
 overscroll-behavior:none;
}
body{
 min-height:100vh;
 font-family:system-ui,sans-serif;
 background:linear-gradient(135deg,#dce9df,#cbdcd2,#e9e7d9);
 color:#344b40;
 text-align:center;
 padding:18px 10px;
}
h1{
 margin:5px 0 12px;
 font-size:clamp(25px,6vw,38px);
 color:#426b54;
}
.panel{
 max-width:480px;
 margin:auto;
 background:#ffffffb5;
 border:1px solid white;
 border-radius:22px;
 padding:12px;
 backdrop-filter:blur(12px);
 box-shadow:0 10px 30px #617c6850;
}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-bottom:12px;
}
.stat{
 background:#e7eee7;
 border-radius:15px;
 padding:8px 3px;
}
.stat small{
 display:block;
 font-size:11px;
 color:#607568;
}
.stat strong{
 font-size:22px;
 color:#365c45;
}
#game{
 position:relative;
 width:min(100%,420px);
 aspect-ratio:420/620;
 margin:auto;
 overflow:hidden;
 border:4px solid white;
 border-radius:18px;
 background:#e5eee4;
 box-shadow:inset 0 0 20px #ffffffaa,0 5px 15px #637a6850;
 touch-action:none;
}
canvas{
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}
#message{
 position:absolute;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:#344b40dd;
 z-index:5;
 color:white;
}
#message h2{
 font-size:36px;
 margin:5px;
}
button{
 border:0;
 border-radius:30px;
 padding:11px 20px;
 margin:6px;
 font-weight:900;
 font-size:15px;
 color:#355b45;
 background:#f7fff7;
 box-shadow:0 4px 0 #b8cdbb;
 cursor:pointer;
}
button:active{
 transform:translateY(3px);
 box-shadow:0 1px 0 #b8cdbb;
}
.evolution,.savebox,.controls{
 margin:15px auto 8px;
 background:#ffffffb5;
 border-radius:18px;
 padding:12px;
 max-width:440px;
 box-shadow:0 5px 15px #617c6830;
}
.evolution h3,.savebox h3,.controls h3{
 margin:0 0 8px;
 color:#426b54;
}
.fruits{
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:5px;
}
.fruit-step{
 width:35px;
 height:48px;
 border-radius:12px;
 background:#e9eee6;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 font-size:23px;
}
.fruit-step small{
 font-size:9px;
 color:#536b59;
}
.fruit-step:last-child{
 background:#f4edce;
}
.hint{
 font-size:12px;
 margin:9px 0 3px;
 color:#65786a;
}
textarea{
 width:100%;
 height:100px;
 border:2px solid #c6d8c9;
 border-radius:12px;
 padding:10px;
 font-size:12px;
 resize:vertical;
 background:#fafffa;
 color:#344b40;
}
#status{
 font-size:13px;
 min-height:20px;
 color:#426b54;
 font-weight:bold;
}
.key{
 display:inline-block;
 background:#e7eee7;
 border:1px solid #b9cdbd;
 border-radius:7px;
 padding:4px 9px;
 margin:3px;
 font-weight:bold;
 color:#365c45;
 box-shadow:0 2px 0 #b9cdbd;
}
</style>
</head>
<body>

<h1>🍉 Suika 🍉</h1>

<div class="panel">
 <div class="stats">
  <div class="stat">
   <small>⭐ スコア</small>
   <strong id="score">0</strong>
  </div>
  <div class="stat">
   <small>🏆 ベスト</small>
   <strong id="best">0</strong>
  </div>
  <div class="stat">
   <small>🎮 プレイ回数</small>
   <strong id="plays">0</strong>
  </div>
 </div>

 <div class="stat" style="margin-bottom:10px">
  <small>🍒 次のフルーツ</small>
  <strong id="next">🍒</strong>
 </div>

 <div id="game">
  <canvas id="canvas" width="420" height="620"></canvas>
  <div id="message">
   <h2>ゲームオーバー！</h2>
   <p id="finalScore"></p>
   <button onclick="restart()">もう一度遊ぶ 🔄</button>
  </div>
 </div>

 <div class="hint">画面をタップしてもフルーツを落とせるよ！</div>
 <button onclick="restart()">🔄 リスタート</button>
</div>

<div class="controls">
 <h3>⌨️ キーボード操作</h3>
 <div>
  <span class="key">←</span>
  <span class="key">→</span>
  <span class="key">A</span>
  <span class="key">D</span>
  <span class="key">移動</span>
 </div>
 <div>
  <span class="key">SPACE</span>
  <span class="key">落とす</span>
 </div>
 <div class="hint">矢印キーやスペースキーを押してもページはスクロールしないよ。</div>
</div>

<div class="savebox">
 <h3>💾 セーブ・引き継ぎ</h3>
 <button onclick="createSave()">セーブコード発行</button>
 <button onclick="copySave()">📋 コピー</button>
 <textarea id="saveCode" placeholder="セーブコードがここに表示されるよ"></textarea>
 <button onclick="loadSave()">📥 セーブコードを読み込む</button>
 <div id="status"></div>
 <div class="hint">途中の盤面・スコア・プレイ回数などを保存できるよ。</div>
</div>

<div class="evolution">
 <h3>🌈 フルーツ進化の輪 🌈</h3>
 <div class="fruits" id="evolution"></div>
 <div class="hint">同じフルーツを合体させて進化！</div>
</div>

<script>
"use strict";

const {Engine,Bodies,Body,Composite}=Matter;

const W=420;
const H=620;

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const fruits=[
 {emoji:"🍒",name:"さくらんぼ",r:16,points:1},
 {emoji:"🍓",name:"いちご",r:23,points:3},
 {emoji:"🍇",name:"ぶどう",r:29,points:6},
 {emoji:"🍊",name:"みかん",r:36,points:10},
 {emoji:"🍋",name:"レモン",r:43,points:15},
 {emoji:"🍑",name:"もも",r:50,points:21},
 {emoji:"🍍",name:"パイン",r:58,points:28},
 {emoji:"🥥",name:"ココナッツ",r:67,points:36},
 {emoji:"🍈",name:"メロン",r:77,points:45},
 {emoji:"🍉",name:"スイカ",r:88,points:60}
];

const fruitColors=[
 ["#ffd0d9","#e83d58"],
 ["#ffe0e8","#e83d68"],
 ["#e7c9ff","#8546b9"],
 ["#ffe5a8","#e98a20"],
 ["#fff8b1","#e6c52b"],
 ["#ffd4c2","#e97962"],
 ["#fff0a0","#d99a22"],
 ["#f2d7b4","#95613d"],
 ["#e1f6a9","#68a84b"],
 ["#c9ef91","#218844"]
];

const engine=Engine.create({
 enableSleeping:false,
 gravity:{x:0,y:1.15,scale:0.001}
});

let score=0;
let best=Number(localStorage.getItem("suikaBest")||0);
let plays=Number(localStorage.getItem("suikaPlays")||0);

let nextLevel=0;
let currentX=W/2;
let canDrop=true;
let gameOver=false;
let bodies=[];
let effects=[];
let overflowTimer=0;
let lastTime=0;

let keys={left:false,right:false};
let lastDrop=0;
let dropCooldown=450;

function showStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("plays").textContent=plays;
}

function makeEvolution(){
 const el=document.getElementById("evolution");
 el.innerHTML="";

 fruits.forEach((f,i)=>{
  const d=document.createElement("div");
  d.className="fruit-step";
  d.innerHTML=f.emoji+"<small>"+(i+1)+"</small>";
  d.title=f.name;
  el.appendChild(d);
 });
}

function randomLevel(){
 return Math.floor(Math.random()*5);
}

function createFruit(x,y,level){
 const f=fruits[level];

 const b=Bodies.circle(x,y,f.r,{
  restitution:0.12,
  friction:0.15,
  density:0.0015,
  frictionAir:0.002,
  label:"fruit",
  render:{visible:false}
 });

 b.level=level;
 b.merging=false;

 Composite.add(engine.world,b);
 bodies.push(b);

 return b;
}

function updateNext(){
 document.getElementById("next").textContent=fruits[nextLevel].emoji;
}

function updateScore(n){
 score+=n;

 if(score>best){
  best=score;
  localStorage.setItem("suikaBest",best);
 }

 showStats();
}

function addWalls(){
 const wall=[
  Bodies.rectangle(-12,H/2,24,H,{isStatic:true}),
  Bodies.rectangle(W+12,H/2,24,H,{isStatic:true}),
  Bodies.rectangle(W/2,H+12,W,24,{isStatic:true})
 ];

 Composite.add(engine.world,wall);
}

function startGame(countPlay=true){
 Composite.clear(engine.world,false);
 Engine.clear(engine);

 bodies=[];
 effects=[];
 score=0;
 overflowTimer=0;
 gameOver=false;
 canDrop=true;
 currentX=W/2;
 keys.left=false;
 keys.right=false;

 if(countPlay){
  plays++;
  localStorage.setItem("suikaPlays",plays);
 }

 showStats();

 document.getElementById("message").style.display="none";

 addWalls();

 nextLevel=randomLevel();
 updateNext();
}

function restart(){
 startGame(true);
}

function drop(){
 if(!canDrop||gameOver)return;

 const f=fruits[nextLevel];

 const x=Math.max(
  f.r+5,
  Math.min(W-f.r-5,currentX)
 );

 createFruit(x,75,nextLevel);

 nextLevel=randomLevel();
 updateNext();

 canDrop=false;
 lastDrop=performance.now();
}

function setX(e){
 const rect=canvas.getBoundingClientRect();

 currentX=(e.clientX-rect.left)*W/rect.width;

 const r=fruits[nextLevel].r;

 currentX=Math.max(
  r+5,
  Math.min(W-r-5,currentX)
 );
}

canvas.addEventListener("pointermove",e=>{
 setX(e);
});

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 setX(e);
 drop();
});

function addEffect(x,y,emoji){
 effects.push({
  x,y,emoji,
  life:1,
  size:25+Math.random()*20,
  vx:(Math.random()-.5)*5,
  vy:-2-Math.random()*4
 });

 for(let i=0;i<12;i++){
  effects.push({
   x,y,
   emoji:"✨",
   life:1,
   size:10+Math.random()*12,
   vx:(Math.random()-.5)*9,
   vy:(Math.random()-.5)*9
  });
 }
}

function merge(a,b){
 if(gameOver||a.merging||b.merging)return;
 if(a.level!==b.level)return;
 if(a.level>=fruits.length-1)return;

 a.merging=true;
 b.merging=true;

 const x=(a.position.x+b.position.x)/2;
 const y=(a.position.y+b.position.y)/2;
 const level=a.level+1;

 Composite.remove(engine.world,a);
 Composite.remove(engine.world,b);

 bodies=bodies.filter(v=>v!==a&&v!==b);

 const newFruit=createFruit(x,y,level);

 Body.setVelocity(newFruit,{
  x:(a.velocity.x+b.velocity.x)/2,
  y:-2
 });

 updateScore(fruits[level].points);
 addEffect(x,y,fruits[level].emoji);
}

function collisionCheck(){
 for(const p of engine.pairs.list){
  if(!p.isActive)continue;

  const a=p.bodyA;
  const b=p.bodyB;

  if(a.label!=="fruit"||b.label!=="fruit")continue;
  if(a.level!==b.level)continue;
  if(a.level>=fruits.length-1)continue;
  if(a.merging||b.merging)continue;

  merge(a,b);
 }
}

function checkGameOver(dt){
 if(gameOver)return;

 let danger=false;

 for(const b of bodies){
  if(
   b.position.y-fruits[b.level].r<105&&
   b.position.y>90&&
   Math.abs(b.velocity.y)<0.5
  ){
   danger=true;
   break;
  }
 }

 if(danger)overflowTimer+=dt;
 else overflowTimer=0;

 if(overflowTimer>1800){
  gameOver=true;

  document.getElementById("finalScore").textContent=
   "スコア："+score+" 点";

  document.getElementById("message").style.display="flex";
 }
}

/* フルーツごとの色と絵文字 */
function drawFruit(b){
 const f=fruits[b.level];
 const r=f.r;
 const x=b.position.x;
 const y=b.position.y;

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(b.angle);

 const colors=fruitColors[b.level];

 const g=ctx.createRadialGradient(
  -r*.35,-r*.4,2,
  0,0,r*1.3
 );

 g.addColorStop(0,"#ffffff");
 g.addColorStop(.3,colors[0]);
 g.addColorStop(1,colors[1]);

 ctx.beginPath();
 ctx.arc(0,0,r,0,Math.PI*2);

 ctx.fillStyle=g;
 ctx.shadowColor="#536b5960";
 ctx.shadowBlur=7;
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.lineWidth=2.5;
 ctx.strokeStyle="#ffffffcc";
 ctx.stroke();

 ctx.font=`${r*1.3}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(f.emoji,0,2);

 ctx.restore();
}

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);

 g.addColorStop(0,"#e5eee4");
 g.addColorStop(.7,"#edf0e5");
 g.addColorStop(1,"#f1eee1");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.save();
 ctx.setLineDash([8,7]);
 ctx.strokeStyle="#9caf9d";
 ctx.lineWidth=2;

 ctx.beginPath();
 ctx.moveTo(0,100);
 ctx.lineTo(W,100);
 ctx.stroke();

 ctx.restore();

 ctx.fillStyle="#87998b";
 ctx.font="12px sans-serif";
 ctx.fillText("GAME OVER LINE",8,92);
}

function drawEffects(dt){
 effects=effects.filter(e=>e.life>0);

 for(const e of effects){
  e.x+=e.vx;
  e.y+=e.vy;
  e.vy+=.12;
  e.life-=dt/650;

  ctx.globalAlpha=Math.max(0,e.life);
  ctx.font=e.size+"px serif";
  ctx.textAlign="center";
  ctx.fillText(e.emoji,e.x,e.y);
 }

 ctx.globalAlpha=1;
}

function drawPreview(){
 if(gameOver||!canDrop)return;

 const f=fruits[nextLevel];

 ctx.globalAlpha=.55;
 ctx.font=(f.r*1.25)+"px serif";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(f.emoji,currentX,75);

 ctx.globalAlpha=1;

 ctx.strokeStyle="#879e8c99";
 ctx.setLineDash([4,5]);

 ctx.beginPath();
 ctx.moveTo(currentX,100);
 ctx.lineTo(currentX,H-5);
 ctx.stroke();

 ctx.setLineDash([]);
}

/* キーボード操作 */
function isTyping(){
 const el=document.activeElement;
 return el&&(
  el.tagName==="TEXTAREA"||
  el.tagName==="INPUT"||
  el.tagName==="SELECT"||
  el.isContentEditable
 );
}

window.addEventListener("keydown",e=>{
 if(isTyping())return;

 const k=e.key.toLowerCase();

 const blockKeys=[
  "arrowleft","arrowright","arrowup","arrowdown"," ",
  "a","d"
 ];

 if(blockKeys.includes(k)){
  e.preventDefault();
 }

 if(k==="arrowleft"||k==="a"){
  keys.left=true;
 }

 if(k==="arrowright"||k==="d"){
  keys.right=true;
 }

 if(k===" "||k==="enter"){
  if(!e.repeat){
   drop();
  }
 }
},{passive:false});

window.addEventListener("keyup",e=>{
 if(isTyping())return;

 const k=e.key.toLowerCase();

 if([
  "arrowleft","arrowright","arrowup","arrowdown"," ",
  "a","d"
 ].includes(k)){
  e.preventDefault();
 }

 if(k==="arrowleft"||k==="a"){
  keys.left=false;
 }

 if(k==="arrowright"||k==="d"){
  keys.right=false;
 }
},{passive:false});

window.addEventListener("blur",()=>{
 keys.left=false;
 keys.right=false;
});

function updateKeyboard(dt){
 if(gameOver)return;

 const speed=0.38*dt;

 if(keys.left)currentX-=speed;
 if(keys.right)currentX+=speed;

 const r=fruits[nextLevel].r;

 currentX=Math.max(
  r+5,
  Math.min(W-r-5,currentX)
 );
}

function loop(time){
 const dt=Math.min(time-lastTime||16,32);
 lastTime=time;

 updateKeyboard(dt);

 if(!canDrop&&performance.now()-lastDrop>=dropCooldown){
  canDrop=true;
 }

 if(!gameOver){
  Engine.update(engine,dt);
  collisionCheck();
  checkGameOver(dt);
 }

 drawBackground();
 drawPreview();

 bodies.forEach(drawFruit);

 drawEffects(dt);

 requestAnimationFrame(loop);
}

/* セーブコード */
function createSave(){
 try{
  const data={
   version:1,
   score,
   best,
   plays,
   nextLevel,
   currentX,
   gameOver,
   overflowTimer,
   fruits:bodies.map(b=>({
    level:b.level,
    x:b.position.x,
    y:b.position.y,
    vx:b.velocity.x,
    vy:b.velocity.y,
    angle:b.angle,
    angularVelocity:b.angularVelocity
   }))
  };

  const json=JSON.stringify(data);

  const code="SUIKA1-"+btoa(
   unescape(encodeURIComponent(json))
  );

  document.getElementById("saveCode").value=code;

  document.getElementById("status").textContent=
   "✅ セーブコードを発行したよ！";

 }catch(e){
  document.getElementById("status").textContent=
   "❌ セーブに失敗しました。";
 }
}

async function copySave(){
 const box=document.getElementById("saveCode");

 if(!box.value.trim())createSave();

 try{
  await navigator.clipboard.writeText(box.value);

  document.getElementById("status").textContent=
   "📋 コピーしたよ！";

 }catch(e){
  box.select();
  document.execCommand("copy");

  document.getElementById("status").textContent=
   "📋 コピーしたよ！";
 }
}

function loadSave(){
 try{
  const code=document.getElementById("saveCode").value.trim();

  if(!code.startsWith("SUIKA1-")){
   throw new Error("コード形式が違います");
  }

  const json=decodeURIComponent(
   escape(atob(code.slice(7)))
  );

  const data=JSON.parse(json);

  if(data.version!==1||!Array.isArray(data.fruits)){
   throw new Error("データが正しくありません");
  }

  if(
   !Number.isFinite(data.score)||
   !Number.isFinite(data.best)||
   !Number.isFinite(data.plays)
  ){
   throw new Error("数値データが不正です");
  }

  if(
   !Number.isInteger(data.nextLevel)||
   data.nextLevel<0||
   data.nextLevel>=fruits.length
  ){
   throw new Error("次のフルーツが不正です");
  }

  if(data.fruits.length>500){
   throw new Error("フルーツ数が多すぎます");
  }

  for(const f of data.fruits){
   if(
    !Number.isInteger(f.level)||
    f.level<0||
    f.level>=fruits.length||
    ![f.x,f.y,f.vx,f.vy,f.angle,f.angularVelocity]
     .every(Number.isFinite)
   ){
    throw new Error("盤面データが不正です");
   }
  }

  startGame(false);

  score=data.score;
  best=Math.max(data.best,best);
  plays=data.plays;

  nextLevel=data.nextLevel;
  currentX=Math.max(
   10,
   Math.min(W-10,Number(data.currentX)||W/2)
  );

  gameOver=!!data.gameOver;
  overflowTimer=Math.max(
   0,
   Number(data.overflowTimer)||0
  );

  for(const f of data.fruits){
   const b=createFruit(f.x,f.y,f.level);

   Body.setVelocity(b,{
    x:f.vx,
    y:f.vy
   });

   Body.setAngle(b,f.angle);
   Body.setAngularVelocity(b,f.angularVelocity);
  }

  localStorage.setItem("suikaBest",best);
  localStorage.setItem("suikaPlays",plays);

  showStats();
  updateNext();

  if(gameOver){
   document.getElementById("finalScore").textContent=
    "スコア："+score+" 点";

   document.getElementById("message").style.display="flex";
  }

  document.getElementById("status").textContent=
   "✅ セーブデータを復元したよ！";

 }catch(e){
  document.getElementById("status").textContent=
   "❌ 読み込み失敗："+e.message;
 }
}

makeEvolution();
showStats();
startGame(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
