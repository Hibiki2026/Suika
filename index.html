
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suika</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px 10px 30px;
  background:#e9eee7;color:#34443a;
  font-family:system-ui,sans-serif;text-align:center;
}
h1{margin:4px 0 12px;font-size:30px}
.panel{
  position:relative;
  z-index:10;
  max-width:460px;
  margin:0 auto 12px;
  padding:12px;
  background:#fff;
  border-radius:17px;
  box-shadow:0 4px 15px #52634b18;
}
.stats{display:flex;justify-content:space-around;gap:7px}
.stat{flex:1;background:#f1f5ee;border-radius:12px;padding:8px}
.stat strong{display:block;font-size:22px}
.stat small{color:#718071}
button,select,input{
  border:0;border-radius:12px;padding:10px 13px;
  font-size:15px;background:#dce9d8;color:#34443a;
  cursor:pointer;margin:3px;
}
button:active{transform:scale(.96)}
.primary{background:#83ad83;color:white}
#game{
  position:relative;
  width:min(420px,96vw);
  height:500px;
  margin:0 auto 12px;
  z-index:1;
}
#physicsCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:20;
  pointer-events:none;
}
#controls{
  position:relative;
  z-index:10;
  display:flex;
  justify-content:center;
  gap:6px;
  margin:12px auto;
}
.hint{font-size:12px;color:#718071;line-height:1.7}
#saveInput{
  width:min(95%,400px);
  background:#f5f7f2;
  border:1px solid #ccd8c9;
}
#message{
  display:none;
  position:fixed;
  z-index:30;
  inset:0;
  background:#ffffffdf;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:25px;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>🍉 Suika</h1>

<div class="panel">
  <div class="stats">
    <div class="stat"><small>スコア</small><strong id="score">0</strong></div>
    <div class="stat"><small>ベスト</small><strong id="best">0</strong></div>
    <div class="stat"><small>プレイ回数</small><strong id="plays">0</strong></div>
  </div>
  <p>次のフルーツ：<span id="next">🍒</span></p>
  <label>モード：</label>
  <select id="mode">
    <option value="normal">通常モード</option>
    <option value="slippery">よく滑るモード 🧊</option>
  </select>
</div>

<div id="game"></div>
<canvas id="physicsCanvas"></canvas>

<div id="controls">
  <button onclick="move(-1)">◀ 左</button>
  <button class="primary" onclick="dropFruit()">⬇ 落とす</button>
  <button onclick="move(1)">右 ▶</button>
</div>

<div class="panel">
  <p class="hint">← →：移動　／　↓：落とす</p>
</div>

<div class="panel">
  <h3>セーブ・引き継ぎ</h3>
  <button class="primary" onclick="makeSave()">セーブコード発行</button>
  <button onclick="copySave()">コピー</button>
  <p><input id="saveInput" placeholder="セーブコードを入力"></p>
  <button onclick="loadSave()">読み込む</button>
</div>

<div id="message">
  <div>ゲームオーバー！</div>
  <p id="finalScore"></p>
  <button class="primary" onclick="restart()">もう一度遊ぶ</button>
</div>

<script>
const {
  Engine,Bodies,Body,Composite,Events
}=Matter;

const engine=Engine.create();
engine.gravity.y=1;
engine.positionIterations=8;
engine.velocityIterations=6;

const canvas=document.getElementById("physicsCanvas");
const ctx=canvas.getContext("2d");
const game=document.getElementById("game");

const FRUITS=["🍒","🍓","🍇","🍊","🍋","🍑","🍍","🥥","🍈","🍉"];
const BASE=[14,18,22,28,34,41,49,59,70,82];
const SCALE=[1,1,1.5,1,1,1,1.3,1,1,2];

function radius(level){
  return BASE[level]*SCALE[level];
}

let fruits=[];
let bowlBodies=[];
let uiBodies=[];
let score=0;
let best=Number(localStorage.getItem("suikaBest")||0);
let plays=Number(localStorage.getItem("suikaPlays")||0);
let currentLevel=0;
let nextLevel=0;
let currentX=innerWidth/2;
let gameOver=false;
let dropping=false;
let lastDrop=0;
let mergeLock=new Set();
let saveCode="";
let bowl={};

function resizeCanvas(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  rebuildBowl();
}

function getBowl(){
  const rect=game.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const top=rect.top+35;
  const bottom=rect.top+rect.height-25;
  const topHalf=Math.min(175,rect.width*.43);
  const bottomHalf=Math.min(125,rect.width*.30);
  return {cx,top,bottom,topHalf,bottomHalf};
}

function wallSegment(x1,y1,x2,y2){
  const dx=x2-x1;
  const dy=y2-y1;
  const len=Math.hypot(dx,dy);
  return Bodies.rectangle(
    (x1+x2)/2,(y1+y2)/2,
    len+10,13,
    {
      isStatic:true,
      angle:Math.atan2(dy,dx),
      friction:.8,
      restitution:.05
    }
  );
}

function rebuildBowl(){
  for(const b of bowlBodies)Composite.remove(engine.world,b);
  bowlBodies=[];

  bowl=getBowl();

  // 底
  bowlBodies.push(Bodies.rectangle(
    bowl.cx,bowl.bottom+5,
    bowl.bottomHalf*2+20,18,
    {isStatic:true,friction:.8}
  ));

  // 左右のカーブ
  for(let i=0;i<7;i++){
    const t1=i/7;
    const t2=(i+1)/7;

    const y1=bowl.top+(bowl.bottom-bowl.top)*t1;
    const y2=bowl.top+(bowl.bottom-bowl.top)*t2;
    const x1=bowl.topHalf+(bowl.bottomHalf-bowl.topHalf)*t1;
    const x2=bowl.topHalf+(bowl.bottomHalf-bowl.topHalf)*t2;

    bowlBodies.push(wallSegment(
      bowl.cx-x1,y1,bowl.cx-x2,y2
    ));
    bowlBodies.push(wallSegment(
      bowl.cx+x1,y1,bowl.cx+x2,y2
    ));
  }

  Composite.add(engine.world,bowlBodies);
}

function updateStats(){
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=best;
  document.getElementById("plays").textContent=plays;
  document.getElementById("next").textContent=FRUITS[nextLevel];
}

function createFruit(x,y,level){
  const slippery=document.getElementById("mode").value==="slippery";
  const r=radius(level);

  const f=Bodies.circle(x,y,r,{
    restitution:slippery?.2:.03,
    friction:slippery?.001:.14,
    frictionStatic:slippery?.001:.5,
    frictionAir:slippery?.0001:.018,
    density:.0015
  });

  f.level=level;
  f.isFruit=true;
  f.outsideTicks=0;

  fruits.push(f);
  Composite.add(engine.world,f);
  return f;
}

function applyMode(){
  const slippery=document.getElementById("mode").value==="slippery";

  for(const f of fruits){
    f.friction=slippery?.001:.14;
    f.frictionStatic=slippery?.001:.5;
    f.frictionAir=slippery?.0001:.018;
    f.restitution=slippery?.2:.03;
  }
}

function chooseNext(){
  nextLevel=Math.floor(Math.random()*5);
  updateStats();
}

function startCurrent(){
  if(gameOver)return;
  currentLevel=nextLevel;
  currentX=bowl.cx;
  chooseNext();
}

function move(dir){
  if(gameOver||dropping)return;
  currentX=Math.max(15,Math.min(innerWidth-15,currentX+dir*24));
}

function dropFruit(){
  if(gameOver||dropping)return;
  if(Date.now()-lastDrop<180)return;

  lastDrop=Date.now();
  dropping=true;

  createFruit(
    Math.max(bowl.cx-bowl.bottomHalf*.7,
      Math.min(bowl.cx+bowl.bottomHalf*.7,currentX)),
    bowl.top-20,
    currentLevel
  );

  setTimeout(()=>{
    dropping=false;
    startCurrent();
  },350);
}

// 合体
Events.on(engine,"collisionStart",event=>{
  for(const pair of event.pairs){
    const a=pair.bodyA;
    const b=pair.bodyB;

    if(!a.isFruit||!b.isFruit)continue;
    if(a.level!==b.level||a.level>=9)continue;
    if(mergeLock.has(a.id)||mergeLock.has(b.id))continue;

    mergeLock.add(a.id);
    mergeLock.add(b.id);

    const x=(a.position.x+b.position.x)/2;
    const y=(a.position.y+b.position.y)/2;
    const newLevel=a.level+1;

    setTimeout(()=>{
      if(!fruits.includes(a)||!fruits.includes(b))return;

      Composite.remove(engine.world,a);
      Composite.remove(engine.world,b);
      fruits=fruits.filter(f=>f!==a&&f!==b);

      mergeLock.delete(a.id);
      mergeLock.delete(b.id);

      createFruit(x,y,newLevel);

      score+=(newLevel+1)*10;
      if(score>best){
        best=score;
        localStorage.setItem("suikaBest",best);
      }
      updateStats();
    },70);
  }
});

// UIは固定。衝突用の透明な物理ボディだけを動かす
function updateUIBodies(){
  const elements=[
    ...document.querySelectorAll(".panel, #controls button")
  ];

  for(const item of uiBodies){
    if(!elements.includes(item.el)){
      Composite.remove(engine.world,item.body);
      uiBodies=uiBodies.filter(x=>x!==item);
    }
  }

  for(const el of elements){
    const rect=el.getBoundingClientRect();
    if(!rect.width||!rect.height)continue;

    let item=uiBodies.find(x=>x.el===el);

    const x=rect.left+rect.width/2;
    const y=rect.top+rect.height/2;

    if(!item){
      const body=Bodies.rectangle(
        x,y,rect.width,rect.height,
        {isStatic:true,friction:.7,restitution:.08}
      );
      item={el,body,w:rect.width,h:rect.height};
      uiBodies.push(item);
      Composite.add(engine.world,body);
    }else{
      Body.setPosition(item.body,{x,y});
      if(Math.abs(item.w-rect.width)>1||
         Math.abs(item.h-rect.height)>1){
        Composite.remove(engine.world,item.body);
        item.body=Bodies.rectangle(
          x,y,rect.width,rect.height,
          {isStatic:true,friction:.7,restitution:.08}
        );
        item.w=rect.width;
        item.h=rect.height;
        Composite.add(engine.world,item.body);
      }
    }
  }
}

// 果物の描画
function drawFruit(f){
  const r=radius(f.level);

  ctx.save();
  ctx.translate(f.position.x,f.position.y);
  ctx.rotate(f.angle);

  if(f.level===9){
    // 丸いスイカ
    const grad=ctx.createRadialGradient(
      -r*.35,-r*.4,1,0,0,r
    );
    grad.addColorStop(0,"#c6ed91");
    grad.addColorStop(.55,"#59ae50");
    grad.addColorStop(1,"#226b39");

    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(0,0,r*.97,0,Math.PI*2);
    ctx.clip();

    ctx.strokeStyle="#236b3a";
    ctx.lineWidth=Math.max(2,r*.07);
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.ellipse(i*r*.34,0,r*.15,r*1.1,0,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }else{
    // 絵文字の余白を当たり判定に影響させない
    ctx.save();
    ctx.beginPath();
    ctx.arc(0,0,r*.94,0,Math.PI*2);
    ctx.clip();
    ctx.font=`${r*1.5}px "Apple Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(FRUITS[f.level],0,0);
    ctx.restore();
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);

  bowl=getBowl();

  // 器の内側
  ctx.beginPath();
  ctx.moveTo(bowl.cx-bowl.topHalf,bowl.top);
  ctx.quadraticCurveTo(
    bowl.cx-bowl.topHalf*.8,bowl.bottom-35,
    bowl.cx-bowl.bottomHalf,bowl.bottom
  );
  ctx.lineTo(bowl.cx+bowl.bottomHalf,bowl.bottom);
  ctx.quadraticCurveTo(
    bowl.cx+bowl.topHalf*.8,bowl.bottom-35,
    bowl.cx+bowl.topHalf,bowl.top
  );
  ctx.closePath();
  ctx.fillStyle="#dce8d2";
  ctx.fill();

  // 器の縁
  ctx.strokeStyle="#63805e";
  ctx.lineWidth=12;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.beginPath();
  ctx.moveTo(bowl.cx-bowl.topHalf,bowl.top);
  ctx.quadraticCurveTo(
    bowl.cx-bowl.topHalf*.8,bowl.bottom-35,
    bowl.cx-bowl.bottomHalf,bowl.bottom
  );
  ctx.lineTo(bowl.cx+bowl.bottomHalf,bowl.bottom);
  ctx.quadraticCurveTo(
    bowl.cx+bowl.topHalf*.8,bowl.bottom-35,
    bowl.cx+bowl.topHalf,bowl.top
  );
  ctx.stroke();

  // 操作中の果物
  if(!gameOver&&!dropping){
    const r=radius(currentLevel);
    ctx.globalAlpha=.7;
    ctx.font=`${r*1.5}px "Apple Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(FRUITS[currentLevel],currentX,bowl.top-20);
    ctx.globalAlpha=1;
  }

  for(const f of fruits)drawFruit(f);

  requestAnimationFrame(draw);
}

// 画面外に落ちたら終了
function checkEscaped(){
  if(gameOver)return;

  for(const f of fruits){
    const r=radius(f.level);
    if(
      f.position.y>innerHeight+r+10||
      f.position.x<-r-10||
      f.position.x>innerWidth+r+10
    ){
      f.outsideTicks++;
      if(f.outsideTicks>8){
        endGame();
        return;
      }
    }else{
      f.outsideTicks=0;
    }
  }
}

function endGame(){
  gameOver=true;
  document.getElementById("finalScore").textContent="スコア："+score;
  document.getElementById("message").style.display="flex";
}

function restart(){
  for(const f of fruits)Composite.remove(engine.world,f);
  fruits=[];
  mergeLock.clear();

  score=0;
  gameOver=false;
  dropping=false;
  currentX=bowl.cx;

  document.getElementById("message").style.display="none";

  plays++;
  localStorage.setItem("suikaPlays",plays);

  updateStats();
  chooseNext();
  startCurrent();
}

function makeSave(){
  const data={
    score,best,plays,
    mode:document.getElementById("mode").value,
    currentLevel,nextLevel,currentX,
    fruits:fruits.map(f=>({
      x:f.position.x,y:f.position.y,
      vx:f.velocity.x,vy:f.velocity.y,
      angle:f.angle,level:f.level
    }))
  };

  saveCode="SUIKA5-"+btoa(
    unescape(encodeURIComponent(JSON.stringify(data)))
  );
  document.getElementById("saveInput").value=saveCode;
}

function copySave(){
  if(!saveCode)makeSave();
  const input=document.getElementById("saveInput");
  input.select();
  document.execCommand("copy");
  alert("コピーしました！");
}

function loadSave(){
  try{
    const code=document.getElementById("saveInput").value.trim();
    if(!code.startsWith("SUIKA5-"))throw new Error();

    const data=JSON.parse(
      decodeURIComponent(escape(atob(code.slice(7))))
    );
    if(!Array.isArray(data.fruits))throw new Error();

    for(const f of fruits)Composite.remove(engine.world,f);
    fruits=[];
    mergeLock.clear();

    score=Number(data.score)||0;
    best=Math.max(Number(data.best)||0,best);
    plays=Number(data.plays)||plays;
    currentLevel=Math.max(0,Math.min(9,Number(data.currentLevel)||0));
    nextLevel=Math.max(0,Math.min(9,Number(data.nextLevel)||0));
    currentX=Number(data.currentX)||bowl.cx;

    document.getElementById("mode").value=
      data.mode==="slippery"?"slippery":"normal";

    for(const f of data.fruits){
      const level=Math.max(0,Math.min(9,Number(f.level)||0));
      const body=createFruit(Number(f.x)||bowl.cx,Number(f.y)||bowl.top,level);
      Body.setVelocity(body,{
        x:Number(f.vx)||0,y:Number(f.vy)||0
      });
      Body.setAngle(body,Number(f.angle)||0);
    }

    gameOver=false;
    dropping=false;
    document.getElementById("message").style.display="none";
    applyMode();
    updateStats();
    alert("読み込みました！");
  }catch(e){
    alert("セーブコードが正しくありません。");
  }
}

document.getElementById("mode").addEventListener("change",applyMode);

window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowDown"].includes(e.key)){
    e.preventDefault();
    e.stopPropagation();
  }
  if(e.repeat)return;

  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.key==="ArrowDown")dropFruit();
},true);

window.addEventListener("resize",resizeCanvas);
window.addEventListener("scroll",()=>{
  updateUIBodies();
  rebuildBowl();
},{passive:true});

let frame=0;
function physicsLoop(){
  Engine.update(engine,1000/60);

  if(frame++%8===0)updateUIBodies();

  checkEscaped();
  requestAnimationFrame(physicsLoop);
}

resizeCanvas();
updateStats();
chooseNext();
startCurrent();
updateUIBodies();
draw();
physicsLoop();
</script>
</body>
</html>
