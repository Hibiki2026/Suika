<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suika</title>
<script defer src="vendor/matter.min.js"></script>
<script defer src="game.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px 10px 30px;
  background:#e9eee7;color:#34443a;
  font-family:system-ui,sans-serif;text-align:center;
}
h1{margin:4px 0 12px;font-size:30px}
.panel{
  position:relative;
  z-index:10;
  max-width:460px;
  margin:0 auto 12px;
  padding:12px;
  background:#fff;
  border-radius:17px;
  box-shadow:0 4px 15px #52634b18;
}
.stats{display:flex;justify-content:space-around;gap:7px}
.stat{flex:1;background:#f1f5ee;border-radius:12px;padding:8px}
.stat strong{display:block;font-size:22px}
.stat small{color:#718071}
button,select,input{
  border:0;border-radius:12px;padding:10px 13px;
  font-size:15px;background:#dce9d8;color:#34443a;
  cursor:pointer;margin:3px;
}
button:active{transform:scale(.96)}
.primary{background:#83ad83;color:white}
#game{
  position:relative;
  width:min(420px,100%);
  aspect-ratio:420 / 500;
  touch-action:pan-y;
  margin:0 auto 12px;
  z-index:1;
}
#physicsCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:20;
  pointer-events:none;
}
#controls{
  position:relative;
  z-index:10;
  display:flex;
  justify-content:center;
  gap:6px;
  margin:12px auto;
}
.hint{font-size:12px;color:#718071;line-height:1.7}
#saveInput{
  width:min(95%,400px);
  background:#f5f7f2;
  border:1px solid #ccd8c9;
}
#message{
  width:min(88vw,330px);
  border:0;
  border-radius:17px;
  padding:24px;
  color:#34443a;
  box-shadow:0 8px 32px #34443a40;
}
#message::backdrop{background:#ffffffdf}
#message h2{margin:0}
#saveStatus{min-height:1.6em;margin:6px 0 0;font-size:14px}
#saveStatus[data-error]{color:#a22e25}
button:disabled{opacity:.6;cursor:default}
.visually-hidden{
  position:absolute;width:1px;height:1px;padding:0;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
</style>
</head>
<body>

<h1>🍉 Suika</h1>

<div class="panel">
  <div class="stats">
    <div class="stat"><small>スコア</small><strong id="score">0</strong></div>
    <div class="stat"><small>ベスト</small><strong id="best">0</strong></div>
    <div class="stat"><small>プレイ回数</small><strong id="plays">0</strong></div>
  </div>
  <p>次のフルーツ：<span id="next">🍒</span></p>
  <label for="mode">モード：</label>
  <select id="mode">
    <option value="normal">通常モード</option>
    <option value="slippery">よく滑るモード 🧊</option>
  </select>
</div>

<div id="game" role="img" aria-label="スイカゲームの盤面"></div>
<canvas id="physicsCanvas" aria-hidden="true"></canvas>

<div id="controls">
  <button type="button" id="moveLeft">◀ 左</button>
  <button class="primary" type="button" id="dropFruit">⬇ 落とす</button>
  <button type="button" id="moveRight">右 ▶</button>
</div>

<div class="panel">
  <p class="hint">← →：移動　／　↓：落とす<br>盤面をクリック・タップしても落とせます</p>
</div>

<div class="panel">
  <h3>セーブ・引き継ぎ</h3>
  <button class="primary" type="button" id="makeSave">セーブコード発行</button>
  <button type="button" id="copySave">コピー</button>
  <p><label class="visually-hidden" for="saveInput">セーブコード</label><input id="saveInput" placeholder="セーブコードを入力" autocomplete="off" autocapitalize="off" spellcheck="false"></p>
  <button type="button" id="loadSave">読み込む</button>
  <p id="saveStatus" role="status"></p>
</div>

<dialog id="message" aria-labelledby="gameOverTitle">
  <h2 id="gameOverTitle">ゲームオーバー！</h2>
  <p id="finalScore"></p>
  <button class="primary" type="button" id="restart">もう一度遊ぶ</button>
</dialog>
</body>
</html>
