
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suika</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:12px 10px 110px;
  background:#e9eee7;
  color:#34443a;
  font-family:system-ui,sans-serif;
  text-align:center;
  overflow-x:hidden;
}
h1{margin:4px 0 10px;font-size:30px}
.panel{
  position:relative;
  z-index:7;
  max-width:460px;
  margin:0 auto 10px;
  padding:11px;
  background:#fff;
  border-radius:17px;
  box-shadow:0 4px 15px #52634b18;
}
.stats{display:flex;justify-content:space-around;gap:7px}
.stat{flex:1;background:#f1f5ee;border-radius:12px;padding:7px}
.stat strong{display:block;font-size:21px}
.stat small{color:#718071}
button,select,input{
  position:relative;
  z-index:8;
  border:0;
  border-radius:12px;
  padding:10px 13px;
  font-size:15px;
  background:#dce9d8;
  color:#34443a;
  cursor:pointer;
  margin:3px;
}
button:active{transform:scale(.96)}
.primary{background:#83ad83;color:white}
#controls{
  position:fixed;
  z-index:8;
  bottom:10px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  pointer-events:none;
}
#controls button{pointer-events:auto;box-shadow:0 3px 12px #0002}
#physicsCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  pointer-events:none;
}
#message{
  display:none;
  position:fixed;
  z-index:20;
  inset:0;
  background:#ffffffdf;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:25px;
  font-weight:bold;
}
.hint{font-size:12px;color:#718071;line-height:1.6}
#saveInput{width:min(90%,380px);background:#f5f7f2}
</style>
</head>
<body>

<h1>🍉 Suika</h1>

<div class="panel">
  <div class="stats">
    <div class="stat"><small>スコア</small><strong id="score">0</strong></div>
    <div class="stat"><small>ベスト</small><strong id="best">0</strong></div>
    <div class="stat"><small>プレイ回数</small><strong id="plays">0</strong></div>
  </div>
  <p>次のフルーツ：<span id="next">🍒</span></p>
  <label>モード：</label>
  <select id="mode">
    <option value="normal">通常モード</option>
    <option value="slippery">よく滑るモード 🧊</option>
  </select>
</div>

<canvas id="physicsCanvas"></canvas>

<div id="controls">
  <button onclick="move(-1)">◀ 左</button>
  <button class="primary" onclick="dropFruit()">⬇ 落とす</button>
  <button onclick="move(1)">右 ▶</button>
</div>

<div class="panel">
  <p class="hint">
    ← →：移動　↓：落とす<br>
    同じ果物を合体させよう！<br>
    器からあふれた果物は画面に飛び出すよ！
  </p>
</div>

<div class="panel">
  <h3>セーブ・引き継ぎ</h3>
  <button class="primary" onclick="makeSave()">セーブコード発行</button>
  <button onclick="copySave()">コピー</button>
  <p><input id="saveInput" placeholder="セーブコードを入力"></p>
  <button onclick="loadSave()">読み込む</button>
</div>

<div id="message">
  <div>ゲームオーバー！</div>
  <p id="finalScore"></p>
  <button class="primary" onclick="restart()">もう一度遊ぶ</button>
</div>

<script>
const {
  Engine,Bodies,Body,Composite,Events
}=Matter;

const engine=Engine.create();
engine.gravity.y=1.0;
engine.positionIterations=8;
engine.velocityIterations=6;

const canvas=document.getElementById("physicsCanvas");
const ctx=canvas.getContext("2d");

const FRUITS=["🍒","🍓","🍇","🍊","🍋","🍑","🍍","🥥","🍈","🍉"];

// レベルごとの基本サイズ
const RADII=[14,18,22,28,34,41,49,59,70,82];

// ぶどう・パイン・スイカのサイズ調整
const SCALE=[1,1,1.5,1,1,1,1.3,1,1,2];

function radius(level){
  return RADII[level]*SCALE[level];
}

let fruits=[];
let obstacles=[];
let score=0;
let best=Number(localStorage.getItem("suikaBest")||0);
let plays=Number(localStorage.getItem("suikaPlays")||0);
let nextLevel=0;
let currentLevel=0;
let currentX=window.innerWidth/2;
let gameOver=false;
let dropping=false;
let lastDrop=0;
let saveCode="";
let mergeLock=new Set();
let bowlBodies=[];

function resizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  rebuildBowl();
}

function bowlGeometry(){
  const cx=innerWidth/2;
  const bottom=innerHeight*.69;
  const top=innerHeight*.45;
  const bottomHalf=Math.min(125,innerWidth*.30);
  const topHalf=Math.min(175,innerWidth*.43);
  return {cx,bottom,top,bottomHalf,topHalf};
}

// 器は底と左右の短いカーブだけ
function rebuildBowl(){
  for(const b of bowlBodies)Composite.remove(engine.world,b);
  bowlBodies=[];

  const g=bowlGeometry();

  const floor=Bodies.rectangle(
    g.cx,g.bottom+8,g.bottomHalf*2+25,18,
    {isStatic:true,friction:.8}
  );

  bowlBodies.push(floor);

  // 左右の斜めの壁を複数に分けてカーブ風にする
  for(let i=0;i<4;i++){
    const t1=i/4;
    const t2=(i+1)/4;

    const y1=g.bottom-(g.bottom-g.top)*t1;
    const y2=g.bottom-(g.bottom-g.top)*t2;

    const x1=g.bottomHalf+(g.topHalf-g.bottomHalf)*t1;
    const x2=g.bottomHalf+(g.topHalf-g.bottomHalf)*t2;

    const leftX1=g.cx-x1;
    const leftX2=g.cx-x2;
    const rightX1=g.cx+x1;
    const rightX2=g.cx+x2;

    bowlBodies.push(makeWall(leftX1,y1,leftX2,y2));
    bowlBodies.push(makeWall(rightX1,y1,rightX2,y2));
  }

  Composite.add(engine.world,bowlBodies);
}

function makeWall(x1,y1,x2,y2){
  const dx=x2-x1;
  const dy=y2-y1;
  const length=Math.sqrt(dx*dx+dy*dy);
  const angle=Math.atan2(dy,dx);

  return Bodies.rectangle(
    (x1+x2)/2,(y1+y2)/2,
    length+8,12,
    {isStatic:true,angle,friction:.8}
  );
}

function updateStats(){
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=best;
  document.getElementById("plays").textContent=plays;
  document.getElementById("next").textContent=FRUITS[nextLevel];
}

function createFruit(x,y,level){
  const slippery=document.getElementById("mode").value==="slippery";
  const r=radius(level);

  const body=Bodies.circle(x,y,r,{
    restitution:slippery?.22:.04,
    friction:slippery?.001:.14,
    frictionStatic:slippery?.001:.5,
    frictionAir:slippery?.0001:.018,
    density:.0015
  });

  body.level=level;
  body.isFruit=true;
  body.outsideTicks=0;
  fruits.push(body);
  Composite.add(engine.world,body);
  return body;
}

function applyMode(){
  const slippery=document.getElementById("mode").value==="slippery";

  for(const f of fruits){
    f.friction=slippery?.001:.14;
    f.frictionStatic=slippery?.001:.5;
    f.frictionAir=slippery?.0001:.018;
    f.restitution=slippery?.22:.04;
  }
}

function chooseNext(){
  nextLevel=Math.floor(Math.random()*5);
  updateStats();
}

function startCurrent(){
  if(gameOver)return;
  currentLevel=nextLevel;
  currentX=innerWidth/2;
  chooseNext();
}

function move(dir){
  if(gameOver||dropping)return;
  currentX=Math.max(25,Math.min(innerWidth-25,currentX+dir*24));
}

function dropFruit(){
  if(gameOver||dropping)return;
  const now=Date.now();
  if(now-lastDrop<180)return;
  lastDrop=now;

  dropping=true;
  const g=bowlGeometry();
  createFruit(
    Math.max(g.cx-g.bottomHalf*.65,
      Math.min(g.cx+g.bottomHalf*.65,currentX)),
    g.top-25,
    currentLevel
  );

  setTimeout(()=>{
    dropping=false;
    startCurrent();
  },350);
}

// 合体
Events.on(engine,"collisionStart",event=>{
  for(const pair of event.pairs){
    const a=pair.bodyA;
    const b=pair.bodyB;

    if(!a.isFruit||!b.isFruit)continue;
    if(a.level!==b.level)continue;
    if(a.level>=9)continue;
    if(mergeLock.has(a.id)||mergeLock.has(b.id))continue;

    mergeLock.add(a.id);
    mergeLock.add(b.id);

    const x=(a.position.x+b.position.x)/2;
    const y=(a.position.y+b.position.y)/2;
    const level=a.level+1;

    setTimeout(()=>{
      if(!fruits.includes(a)||!fruits.includes(b))return;

      Composite.remove(engine.world,a);
      Composite.remove(engine.world,b);
      fruits=fruits.filter(f=>f!==a&&f!==b);

      mergeLock.delete(a.id);
      mergeLock.delete(b.id);

      createFruit(x,y,level);

      score+=(level+1)*10;
      if(score>best){
        best=score;
        localStorage.setItem("suikaBest",best);
      }
      updateStats();
    },70);
  }
});

// ボタンなどを物理的な障害物にする
function updateObstacles(){
  const elements=[
    ...document.querySelectorAll("#controls button, .panel button, .panel select")
  ];

  const active=new Set(elements);

  for(const item of obstacles){
    if(!active.has(item.element)){
      Composite.remove(engine.world,item.body);
      obstacles=obstacles.filter(x=>x!==item);
    }
  }

  for(const el of elements){
    const rect=el.getBoundingClientRect();
    if(rect.width<=0||rect.height<=0)continue;

    let item=obstacles.find(x=>x.element===el);

    if(!item){
      const body=Bodies.rectangle(
        rect.left+rect.width/2,
        rect.top+rect.height/2,
        rect.width,
        rect.height,
        {isStatic:true,friction:.8,restitution:.12}
      );
      item={element:el,body,w:rect.width,h:rect.height};
      obstacles.push(item);
      Composite.add(engine.world,body);
    }else{
      if(Math.abs(item.w-rect.width)>1||
         Math.abs(item.h-rect.height)>1){
        Composite.remove(engine.world,item.body);
        item.body=Bodies.rectangle(
          rect.left+rect.width/2,
          rect.top+rect.height/2,
          rect.width,rect.height,
          {isStatic:true,friction:.8,restitution:.12}
        );
        item.w=rect.width;
        item.h=rect.height;
        Composite.add(engine.world,item.body);
      }else{
        Body.setPosition(item.body,{
          x:rect.left+rect.width/2,
          y:rect.top+rect.height/2
        });
      }
    }
  }
}

// 果物描画
function drawFruit(f){
  const r=radius(f.level);
  ctx.save();
  ctx.translate(f.position.x,f.position.y);
  ctx.rotate(f.angle);

  if(f.level===9){
    // スイカは丸い球体
    const grad=ctx.createRadialGradient(
      -r*.35,-r*.4,1,0,0,r
    );
    grad.addColorStop(0,"#bce98d");
    grad.addColorStop(.6,"#55a94d");
    grad.addColorStop(1,"#236d3a");

    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(0,0,r*.97,0,Math.PI*2);
    ctx.clip();

    ctx.strokeStyle="#26713e";
    ctx.lineWidth=Math.max(2,r*.07);
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.ellipse(i*r*.34,0,r*.15,r*1.1,0,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }else{
    // パインを含め、絵文字は普通の見た目にする
    const size=r*1.55;
    ctx.save();
    ctx.beginPath();
    ctx.arc(0,0,r*.94,0,Math.PI*2);
    ctx.clip();
    ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(FRUITS[f.level],0,0);
    ctx.restore();
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);

  // 器の線だけ描画。周りの四角い囲いはなし
  const g=bowlGeometry();
  ctx.strokeStyle="#8fa88a";
  ctx.lineWidth=9;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.beginPath();
  ctx.moveTo(g.cx-g.topHalf,g.top);
  ctx.quadraticCurveTo(
    g.cx-g.topHalf*.85,g.bottom-30,
    g.cx-g.bottomHalf,g.bottom
  );
  ctx.lineTo(g.cx+g.bottomHalf,g.bottom);
  ctx.quadraticCurveTo(
    g.cx+g.topHalf*.85,g.bottom-30,
    g.cx+g.topHalf,g.top
  );
  ctx.stroke();

  // 操作中の果物
  if(!gameOver&&!dropping){
    const r=radius(currentLevel);
    ctx.globalAlpha=.7;
    ctx.font=`${r*1.55}px "Apple Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(FRUITS[currentLevel],currentX,g.top-25);
    ctx.globalAlpha=1;
  }

  for(const f of fruits)drawFruit(f);

  requestAnimationFrame(draw);
}

// 画面外に落ちたらゲームオーバー
function checkEscaped(){
  if(gameOver)return;

  for(const f of fruits){
    const r=radius(f.level);
    const outside=
      f.position.y>innerHeight+r+10||
      f.position.x<-r-10||
      f.position.x>innerWidth+r+10;

    if(outside){
      f.outsideTicks=(f.outsideTicks||0)+1;
      if(f.outsideTicks>8){
        endGame();
        return;
      }
    }else{
      f.outsideTicks=0;
    }
  }
}

function endGame(){
  gameOver=true;
  document.getElementById("finalScore").textContent="スコア："+score;
  document.getElementById("message").style.display="flex";
}

function restart(){
  for(const f of fruits)Composite.remove(engine.world,f);
  fruits=[];
  mergeLock.clear();

  score=0;
  gameOver=false;
  dropping=false;
  currentX=innerWidth/2;

  document.getElementById("message").style.display="none";

  plays++;
  localStorage.setItem("suikaPlays",plays);

  updateStats();
  chooseNext();
  startCurrent();
}

function makeSave(){
  const data={
    score,best,plays,
    mode:document.getElementById("mode").value,
    currentLevel,nextLevel,currentX,
    fruits:fruits.map(f=>({
      x:f.position.x,y:f.position.y,
      vx:f.velocity.x,vy:f.velocity.y,
      angle:f.angle,level:f.level
    }))
  };

  saveCode="SUIKA4-"+btoa(
    unescape(encodeURIComponent(JSON.stringify(data)))
  );
  document.getElementById("saveInput").value=saveCode;
}

function copySave(){
  if(!saveCode)makeSave();
  const input=document.getElementById("saveInput");
  input.value=saveCode;
  input.select();
  document.execCommand("copy");
  alert("コピーしました！");
}

function loadSave(){
  try{
    const code=document.getElementById("saveInput").value.trim();
    if(!code.startsWith("SUIKA4-"))throw new Error();

    const data=JSON.parse(
      decodeURIComponent(escape(atob(code.slice(7))))
    );
    if(!Array.isArray(data.fruits))throw new Error();

    for(const f of fruits)Composite.remove(engine.world,f);
    fruits=[];
    mergeLock.clear();

    score=Number(data.score)||0;
    best=Math.max(Number(data.best)||0,best);
    plays=Number(data.plays)||plays;
    currentLevel=Math.max(0,Math.min(9,Number(data.currentLevel)||0));
    nextLevel=Math.max(0,Math.min(9,Number(data.nextLevel)||0));
    currentX=Math.max(20,Math.min(innerWidth-20,Number(data.currentX)||innerWidth/2));

    document.getElementById("mode").value=
      data.mode==="slippery"?"slippery":"normal";

    for(const f of data.fruits){
      const level=Math.max(0,Math.min(9,Number(f.level)||0));
      const body=createFruit(
        Number(f.x)||innerWidth/2,
        Number(f.y)||innerHeight/2,
        level
      );
      Body.setVelocity(body,{
        x:Number(f.vx)||0,y:Number(f.vy)||0
      });
      Body.setAngle(body,Number(f.angle)||0);
    }

    gameOver=false;
    dropping=false;
    document.getElementById("message").style.display="none";
    applyMode();
    updateStats();
    alert("読み込みました！");
  }catch(e){
    alert("セーブコードが正しくありません。");
  }
}

document.getElementById("mode").addEventListener("change",applyMode);

window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowDown"].includes(e.key)){
    e.preventDefault();
    e.stopPropagation();
  }
  if(e.repeat)return;

  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.key==="ArrowDown")dropFruit();
},true);

window.addEventListener("resize",resizeCanvas);

let frame=0;
function physicsLoop(){
  Engine.update(engine,1000/60);
  if(frame++%8===0)updateObstacles();
  checkEscaped();
  requestAnimationFrame(physicsLoop);
}

resizeCanvas();
updateStats();
chooseNext();
startCurrent();
updateObstacles();
draw();
physicsLoop();
</script>
</body>
</html>
